
## 📄 Fichier `docker-compose.yml` (pour tests multi-SGBD)

```yaml
version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    image: gvenzl/oracle-xe:18.4.0-slim
    environment:
      ORACLE_PASSWORD: testpass
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/testpass@//localhost:1521/XE", "SELECT 1 FROM DUAL;"]
      interval: 10s
      timeout: 5s
      retries: 20

  schemaspy:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      oracle:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_NAME: testdb
    volumes:
      - ./:/app
    command: ./bin/schemaspy --quiet --db=postgresql --host=postgres --database=testdb --schema=public --user=testuser --password=testpass
