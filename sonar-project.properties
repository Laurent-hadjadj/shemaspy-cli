sonar.projectKey=fr.ma-moulinette:shemaspy-cli
sonar.projectName=ShemaSpy-Cli
sonar.projectVersion=1.3.0

sonar.host.url=https://sonar-local.lilmod-lelamed.fr

sonar.sources=config,src
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php
sonar.test.exclusions=tests/coverage/**
sonar.exclusions=vendor/**,tools/**,ressources/**,report/**,logs/**,LICENSES/**,jdbc/**,jar/**,bin/**

sonar.sourceEncoding=UTF-8

# Rapports générés par : composer test-coverage (ou phpunit -c tests/phpunit.xml avec xdebug.mode=coverage)
# Les chemins sont relatifs à la racine du projet (là où sonar-scanner est lancé).
sonar.php.coverage.reportPaths=tests/coverage.xml
sonar.php.tests.reportPath=tests/junit.xml
